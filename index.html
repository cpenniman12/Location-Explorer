<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random World Location Explorer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e5799, #2989d8, #7db9e8);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        .container {
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 800px;
            text-align: center;
        }
        h1 {
            margin-top: 0;
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .button-container {
            margin: 30px 0;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        button:hover {
            background-color: #45a049;
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }
        button:active {
            transform: scale(0.98);
        }
        .location-info {
            margin-top: 30px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            display: none;
        }
        .location-info.active {
            display: block;
            animation: fadeIn 1s;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .location-name {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #FFD700;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .info-card {
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 20px;
            transition: transform 0.3s ease;
        }
        .info-card:hover {
            transform: translateY(-5px);
        }
        .info-title {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #FFD700;
        }
        .info-value {
            font-size: 1.5rem;
        }
        .map-container {
            margin-top: 20px;
            border-radius: 10px;
            overflow: hidden;
            height: 300px;
        }
        #map {
            width: 100%;
            height: 100%;
            border: none;
        }
        .loading {
            display: none;
            margin: 20px auto;
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error-message {
            color: #ff6b6b;
            display: none;
            margin-top: 20px;
            padding: 10px;
            background-color: rgba(255, 0, 0, 0.1);
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Random World Location Explorer</h1>
        <p>Click the button below to discover a random location around the world and learn about the current time and weather there.</p>
        
        <div class="button-container">
            <button id="exploreButton">Explore New Location</button>
        </div>
        
        <div class="loading" id="loading"></div>
        <div class="error-message" id="errorMessage">Unable to fetch location data. Please try again.</div>
        
        <div class="location-info" id="locationInfo">
            <div class="location-name" id="locationName">Loading...</div>
            
            <div class="info-grid">
                <div class="info-card">
                    <div class="info-title">Local Time</div>
                    <div class="info-value" id="localTime">--:--</div>
                </div>
                <div class="info-card">
                    <div class="info-title">Weather</div>
                    <div class="info-value" id="weather">--°C</div>
                </div>
                <div class="info-card">
                    <div class="info-title">Coordinates</div>
                    <div class="info-value" id="coordinates">--° N, --° E</div>
                </div>
                <div class="info-card">
                    <div class="info-title">Country</div>
                    <div class="info-value" id="country">--</div>
                </div>
            </div>
            
            <div class="map-container">
                <iframe id="map" frameborder="0" scrolling="no" marginheight="0" marginwidth="0"></iframe>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const exploreButton = document.getElementById('exploreButton');
            const locationInfo = document.getElementById('locationInfo');
            const locationName = document.getElementById('locationName');
            const localTime = document.getElementById('localTime');
            const weather = document.getElementById('weather');
            const coordinates = document.getElementById('coordinates');
            const country = document.getElementById('country');
            const map = document.getElementById('map');
            const loading = document.getElementById('loading');
            const errorMessage = document.getElementById('errorMessage');
            
            // List of major cities around the world
            const cities = [
                { name: "Tokyo", lat: 35.6762, lon: 139.6503, country: "Japan" },
                { name: "New York", lat: 40.7128, lon: -74.0060, country: "United States" },
                { name: "London", lat: 51.5074, lon: -0.1278, country: "United Kingdom" },
                { name: "Paris", lat: 48.8566, lon: 2.3522, country: "France" },
                { name: "Sydney", lat: 33.8688, lon: 151.2093, country: "Australia" },
                { name: "Rio de Janeiro", lat: -22.9068, lon: -43.1729, country: "Brazil" },
                { name: "Cairo", lat: 30.0444, lon: 31.2357, country: "Egypt" },
                { name: "Mumbai", lat: 19.0760, lon: 72.8777, country: "India" },
                { name: "Beijing", lat: 39.9042, lon: 116.4074, country: "China" },
                { name: "Cape Town", lat: -33.9249, lon: 18.4241, country: "South Africa" },
                { name: "Moscow", lat: 55.7558, lon: 37.6173, country: "Russia" },
                { name: "Mexico City", lat: 19.4326, lon: -99.1332, country: "Mexico" },
                { name: "Bangkok", lat: 13.7563, lon: 100.5018, country: "Thailand" },
                { name: "Buenos Aires", lat: -34.6037, lon: -58.3816, country: "Argentina" },
                { name: "Berlin", lat: 52.5200, lon: 13.4050, country: "Germany" },
                { name: "Toronto", lat: 43.6532, lon: -79.3832, country: "Canada" },
                { name: "Singapore", lat: 1.3521, lon: 103.8198, country: "Singapore" },
                { name: "Istanbul", lat: 41.0082, lon: 28.9784, country: "Turkey" },
                { name: "Dubai", lat: 25.2048, lon: 55.2708, country: "UAE" },
                { name: "Los Angeles", lat: 34.0522, lon: -118.2437, country: "United States" },
                { name: "Barcelona", lat: 41.3851, lon: 2.1734, country: "Spain" },
                { name: "Seoul", lat: 37.5665, lon: 126.9780, country: "South Korea" },
                { name: "Auckland", lat: -36.8509, lon: 174.7645, country: "New Zealand" },
                { name: "Nairobi", lat: -1.2921, lon: 36.8219, country: "Kenya" },
                { name: "Stockholm", lat: 59.3293, lon: 18.0686, country: "Sweden" },
                { name: "Lima", lat: -12.0464, lon: -77.0428, country: "Peru" },
                { name: "Lisbon", lat: 38.7223, lon: -9.1393, country: "Portugal" },
                { name: "Vienna", lat: 48.2082, lon: 16.3738, country: "Austria" },
                { name: "Helsinki", lat: 60.1699, lon: 24.9384, country: "Finland" },
                { name: "Havana", lat: 23.1136, lon: -82.3666, country: "Cuba" },
                { name: "Reykjavik", lat: 64.1466, lon: -21.9426, country: "Iceland" },
                { name: "Marrakesh", lat: 31.6295, lon: -7.9811, country: "Morocco" },
                { name: "Vancouver", lat: 49.2827, lon: -123.1207, country: "Canada" },
                { name: "Amsterdam", lat: 52.3676, lon: 4.9041, country: "Netherlands" },
                { name: "Copenhagen", lat: 55.6761, lon: 12.5683, country: "Denmark" },
                { name: "Dublin", lat: 53.3498, lon: -6.2603, country: "Ireland" },
                { name: "Prague", lat: 50.0755, lon: 14.4378, country: "Czech Republic" },
                { name: "Zurich", lat: 47.3769, lon: 8.5417, country: "Switzerland" },
                { name: "Athens", lat: 37.9838, lon: 23.7275, country: "Greece" },
                { name: "Rome", lat: 41.9028, lon: 12.4964, country: "Italy" }
            ];
            
            // Function to get a random city
            function getRandomCity() {
                return cities[Math.floor(Math.random() * cities.length)];
            }
            
            // Function to format coordinates
            function formatCoordinates(lat, lon) {
                const latDir = lat >= 0 ? "N" : "S";
                const lonDir = lon >= 0 ? "E" : "W";
                return `${Math.abs(lat).toFixed(2)}° ${latDir}, ${Math.abs(lon).toFixed(2)}° ${lonDir}`;
            }
            
            // Function to get local time for a location
            function getLocalTime(lat, lon) {
                // Calculate rough time zone offset based on longitude
                // Each 15 degrees of longitude represents approximately 1 hour time difference
                const offsetHours = Math.round(lon / 15);
                
                // Get UTC time
                const now = new Date();
                
                // Add the offset (this is a simplification)
                now.setHours(now.getUTCHours() + offsetHours);
                
                return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }
            
            // Function to generate mock weather data
            function generateWeather() {
                const conditions = ["Sunny", "Partly Cloudy", "Cloudy", "Rainy", "Stormy", "Snowy", "Clear", "Foggy", "Windy"];
                const condition = conditions[Math.floor(Math.random() * conditions.length)];
                
                // Generate random temperature between -10°C and 40°C
                const temperature = Math.floor(Math.random() * 50) - 10;
                
                return `${temperature}°C, ${condition}`;
            }
            
            // Function to update the iframe map
            function updateMap(lat, lon) {
                const url = `https://www.openstreetmap.org/export/embed.html?bbox=${lon-0.1}%2C${lat-0.1}%2C${lon+0.1}%2C${lat+0.1}&amp;layer=mapnik&amp;marker=${lat}%2C${lon}`;
                map.src = url;
            }
            
            // Event listener for the explore button
            exploreButton.addEventListener('click', () => {
                // Show loading
                loading.style.display = 'block';
                errorMessage.style.display = 'none';
                locationInfo.classList.remove('active');
                
                // Simulate network delay
                setTimeout(() => {
                    try {
                        const city = getRandomCity();
                        
                        // Update UI
                        locationName.textContent = city.name;
                        localTime.textContent = getLocalTime(city.lat, city.lon);
                        weather.textContent = generateWeather();
                        coordinates.textContent = formatCoordinates(city.lat, city.lon);
                        country.textContent = city.country;
                        
                        // Update map
                        updateMap(city.lat, city.lon);
                        
                        // Hide loading and show results
                        loading.style.display = 'none';
                        locationInfo.classList.add('active');
                    } catch (error) {
                        // Show error message
                        loading.style.display = 'none';
                        errorMessage.style.display = 'block';
                        console.error("Error generating location:", error);
                    }
                }, 1500);
            });
        });
    </script>
</body>
</html>
